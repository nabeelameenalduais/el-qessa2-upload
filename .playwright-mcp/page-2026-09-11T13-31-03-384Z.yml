        - heading "النادي يفتتح موسمه الثقافي لعام 2026" [level=1] [ref=f11e34]
        - img "النادي يفتتح موسمه الثقافي لعام 2026" [ref=f11e36]
        - paragraph [ref=f11e37]: يعلن نادي القصة عن برنامج موسمه الثقافي الجديد، ويتضمن أكثر من عشرين فعالية بين أمسيات وندوات وورش وتوقيعات.
        - generic [ref=f11e38]:
          - paragraph [ref=f11e39]: يعلن نادي القصة «إلمقه» عن انطلاق موسمه الثقافي لعام 2026، مفتتحاً ببرنامج حافل يجمع بين الأصوات المؤسسة والكتّاب الجدد، ويضم أكثر من عشرين فعالية موزعة على أشهر السنة.
          - paragraph [ref=f11e40]: يتضمن الموسم سلسلة أمسيات قصصية شهرية، وندوات أدبية حول مكانة القصة في المشهد اليمني، وورشتين لكتابة القصة، إضافة إلى برنامج إصدارات جديد يدعم الكتّاب في مراحلهم الأولى.
          - paragraph [ref=f11e41]: وقال القائمون على النادي إن الهدف من الموسم هو تأسيس مساحة ثقافية دائمة تحتفي بالكلمة، وتصنع جسراً بين الكتّاب والجمهور، وتمنح المواهب الجديدة فرصة الظهور والاحتكاك بتجارب أعمق.
