          - paragraph [ref=f2e2569]: نادي القصة «إلمقه» مساحة أدبية وثقافية أسّسها عدد من القاصّين والروائيين والنقّاد اليمنيين عام 2024، بهدف خلق بيئة حيّة يلتقي فيها الكتّاب والقرّاء، ويُسمع فيها الصوت الشاب الذي يبحث عن مكانه في المشهد الأدبي.
          - paragraph [ref=f2e2570]: "انطلق النادي حين جمعت مجموعة من الهواة فكرة بسيطة حول الطاولة نفسها: أن نصنع مكاناً يُقرأ فيه نص القصة ويُتفق حوله بحب وصرامة. من ذلك السؤال نمت فعاليات النادي لتشمل ورشاً وندوات وإصدارات وملتقيات وقِطاعاً نقدياً تطبيقياً."
        - generic [ref=f2e2571]:
